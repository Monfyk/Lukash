name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write  # потрібно, щоб публікувати реліз з exe
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: KairoBoost
          path: |
            build/Release/KairoBoost.exe
            build/Release/KairoBoost-cli.exe
      # Версія для продажу — лише в артефактах, не в публічному релізі
      - uses: actions/upload-artifact@v4
        with:
          name: KairoBoostPro
          path: build/Release/KairoBoostPro.exe
      # Реліз із прямим посиланням на exe:
      # https://github.com/<owner>/<repo>/releases/latest/download/KairoBoost.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KairoBoost (збірка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Завантажити: **KairoBoost.exe** нижче (графічна версія). `KairoBoost-cli.exe` — консольна версія.
            Запуск: двічі клацни і дозволь права адміністратора. Якщо Windows покаже «Windows захистила ваш ПК» — «Докладніше» → «Однаково запустити».
          files: |
            build/Release/KairoBoost.exe
            build/Release/KairoBoost-cli.exe
